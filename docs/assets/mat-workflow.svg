<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">MAT: parallel evidence, conditional inquiry, synthesis</title><desc id="desc">A ticker and fiscal year feed Research, Technical and Sentiment Analyst reports. Alpha Strategist compares all three. A conflict without an existing investigation triggers an SA investigation; otherwise synthesis proceeds. Original reports and optional investigation feed the final decision, sources and risks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1070" rx="18" fill="#faf7ef"/>
<text x="48" y="52" fill="#8b6227" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="48" dy="0">MAT / MULTI-AGENT COORDINATION</tspan></text>
<text x="48" y="106" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" text-anchor="start"><tspan x="48" dy="0">Investigate a disagreement before deciding.</tspan></text>
<text x="48" y="145" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Three evidence streams. One coordinator. A conditional extra inquiry.</tspan></text>
<rect x="408" y="180" width="384" height="66" rx="12" fill="#362f24" stroke="#362f24" stroke-width="1.5"/>
<text x="600" y="222" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Company ticker + fiscal year</tspan></text>
<path d="M600 249V272H218V297" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 272V297" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 272H982V297" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="308" width="336" height="141" rx="12" fill="#fff" stroke="#d4c8b3" stroke-width="1.5"/>
<text x="70" y="349" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="70" dy="0">RA · Research Analyst</tspan></text>
<text x="70" y="389" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="70" dy="0">RAGFlow financial excerpts</tspan><tspan x="70" dy="29">Evidence + sources + gaps</tspan></text>
<rect x="432" y="308" width="336" height="141" rx="12" fill="#fff" stroke="#d4c8b3" stroke-width="1.5"/>
<text x="454" y="349" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="454" dy="0">TA · Technical Analyst</tspan></text>
<text x="454" y="389" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="454" dy="0">Prices / technical indicators</tspan><tspan x="454" dy="29">Interpreted market structure</tspan></text>
<rect x="816" y="308" width="336" height="141" rx="12" fill="#fff" stroke="#d4c8b3" stroke-width="1.5"/>
<text x="838" y="349" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="838" dy="0">SA · Sentiment Analyst</tspan></text>
<text x="838" y="389" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="838" dy="0">News / sentiment evidence</tspan><tspan x="838" dy="29">Narratives and tensions</tspan></text>
<path d="M216 452V480H600V503" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 452V503" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M984 452V480H600" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="408" y="513" width="384" height="82" rx="12" fill="#eee3ce" stroke="#c0a572" stroke-width="1.5"/>
<text x="600" y="547" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">AS · Alpha Strategist</tspan></text>
<text x="600" y="579" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Wait for all three → compare reports</tspan></text>
<path d="M600 598V623" fill="none" stroke="#9f865e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 630L762 702L600 774L438 702Z" fill="#fff" stroke="#b79b66" stroke-width="1.8"/>
<text x="600" y="687" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Conflict + no</tspan><tspan x="600" dy="30">investigation yet?</tspan></text>
<path d="M765 702H811" fill="none" stroke="#8b6227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="788" y="684" fill="#8b6227" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="788" dy="0">Yes</tspan></text>
<rect x="822" y="635" width="330" height="143" rx="12" fill="#fff2d7" stroke="#c5a15f" stroke-width="1.5"/>
<text x="844" y="675" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="844" dy="0">SA · targeted investigation</tspan></text>
<text x="844" y="715" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="844" dy="0">Investigate the specific tension</tspan><tspan x="844" dy="28">Return findings and data gaps</tspan></text>
<path d="M600 778V844" fill="none" stroke="#8b6227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="584" y="815" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end"><tspan x="584" dy="0">No</tspan></text>
<path d="M987 781V890H795" fill="none" stroke="#8b6227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="972" y="820" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="end"><tspan x="972" dy="0">Original reports</tspan><tspan x="972" dy="26">+ investigation</tspan></text>
<rect x="408" y="855" width="384" height="78" rx="12" fill="#362f24" stroke="#362f24" stroke-width="1.5"/>
<text x="600" y="888" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">AS · synthesize decision</tspan></text>
<text x="600" y="916" fill="#e8dcc7" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Use the evidence currently available</tspan></text>
<path d="M600 936V972" fill="none" stroke="#8b6227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="1003" fill="#362f24" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle"><tspan x="600" dy="0">Decision + reasoning + sources + risks</tspan></text>
<text x="600" y="1046" fill="#6e6353" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">At most one additional investigation per ticker in stored state; synthesis may retain unresolved gaps.</tspan></text>
</svg>
